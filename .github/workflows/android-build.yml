name: Build Android APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare app icon and Shabnam fonts
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets/fonts
          base64 -d app_icon.b64 > app/src/main/res/drawable/app_icon.png
          curl -L --fail --retry 3 -o app/src/main/assets/fonts/shabnam.ttf \
            https://raw.githubusercontent.com/rastikerdar/shabnam-font/master/dist/Shabnam.ttf
          curl -L --fail --retry 3 -o app/src/main/assets/fonts/shabnam_bold.ttf \
            https://raw.githubusercontent.com/rastikerdar/shabnam-font/master/dist/Shabnam-Bold.ttf

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Hamyar-Sakhteman-A1-Alpha1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hamyar-Sakhteman-A1-Alpha1.1
          path: Hamyar-Sakhteman-A1-Alpha1.1.apk
          if-no-files-found: error
